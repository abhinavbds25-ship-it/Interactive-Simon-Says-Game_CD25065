<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Simon Says</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="header">

            <div class="logo">
                <div class="logo-icon">S</div>

                <div>
                    <h1>Simon Says</h1>
                    <p>Memory Challenge</p>
                </div>
            </div>

            <div class="game-info">

                <div class="info-box">
                    <span>LEVEL</span>
                    <strong id="level">0</strong>
                </div>

                <div class="info-box">
                    <span>SCORE</span>
                    <strong id="score">0</strong>
                </div>

                <div class="info-box">
                    <span>BEST</span>
                    <strong id="bestScore">0</strong>
                </div>

            </div>

        </header>


        <!-- Game Card -->
        <section class="game-card">

            <div class="game-header">

                <h2 id="status">Ready to Play?</h2>

                <p id="instruction">
                    Press the button below to start the game
                </p>

            </div>


            <!-- Simon Buttons -->
            <div class="simon-board">

                <button class="simon-button red" id="red" data-color="red">
                    <span></span>
                </button>

                <button class="simon-button blue" id="blue" data-color="blue">
                    <span></span>
                </button>

                <button class="simon-button green" id="green" data-color="green">
                    <span></span>
                </button>

                <button class="simon-button yellow" id="yellow" data-color="yellow">
                    <span></span>
                </button>

            </div>


            <!-- Start Button -->
            <button id="startButton" class="start-button">

                <span class="play-icon">▶</span>

                <span id="startText">
                    Start Game
                </span>

            </button>


            <!-- Game Rules -->
            <div class="rules">

                <div class="rule">
                    <span>01</span>
                    <p>Watch the sequence</p>
                </div>

                <div class="rule">
                    <span>02</span>
                    <p>Repeat the pattern</p>
                </div>

                <div class="rule">
                    <span>03</span>
                    <p>Reach the highest level</p>
                </div>

            </div>

        </section>


        <!-- Footer -->
        <footer>

            <p>
                Interactive Simon Says Game
            </p>

            <span>
                Built with HTML • CSS • JavaScript
            </span>

        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
